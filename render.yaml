databases:
  - name: cotecmar360-db
    databaseName: cotecmar360
    user: cotecmar
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: cotecmar360-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate --schema prisma/schema.prisma
    startCommand: npx prisma db push --schema prisma/schema.prisma && node src/server.js
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false
        value: https://TU_FRONTEND_VERCEL.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: cotecmar360-db
          property: connectionString
      - key: DEFAULT_ADMIN_NAME
        value: "Administrador Principal"
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@cotecmar.local
      - key: DEFAULT_ADMIN_PASSWORD
        generateValue: true
      - key: DEFAULT_ADMIN_PHONE
        value: ""
      - key: CLOUDINARY_URL
        sync: false
    dependsOn:
      - type: postgres
